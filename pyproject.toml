[project]
name = "portfolio-optimization-engine"
version = "0.1.0"
description = "Pipeline para screening, seleção, alocação e geração de relatório de carteira."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "PuLP>=2.8",
  "yfinance>=0.2",
  "python-bcb>=0.3",
  "yahooquery>=2.3",
  "openai>=1.68",
  "matplotlib>=3.8",
  "reportlab>=4.2",
  "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
